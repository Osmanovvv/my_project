# nginx перед приложением. Ставится install.sh в /etc/nginx/sites-available/itagent,
# __DOMAIN__ подставляется при установке. HTTPS-блок дописывает certbot.
#
# Каждая строка здесь нужна приложению, а не декоративна:
#   gzip            — без него страница грузится втрое дольше (замерено, см. DEPLOY.md);
#   X-Forwarded-*   — из них собираются адреса для sitemap/canonical, ставится Secure
#                     на cookie админки и работает лимит «3 заявки в минуту» с одного IP.
#                     X-Forwarded-For ставится из $remote_addr, а не дописывается
#                     к присланному: перед приложением один nginx, и клиент не должен
#                     уметь подменить свой адрес заголовком. CF-Connecting-IP гасится
#                     по той же причине;
#   client_max_body — загрузка обложек кейсов из админки.
#
# Фотографии (/media/) отдаёт само приложение с вечным кешем — в имени файла
# хеш. Отдавать их nginx-ом напрямую быстрее, но для этого www-data нужен
# доступ в /var/lib/itagent (каталог 750 itagent:itagent), а один забытый
# chmod даёт 404 на все картинки сайта. Не стоит того.

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/xml;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header CF-Connecting-IP "";
        proxy_read_timeout 60s;
    }
}
